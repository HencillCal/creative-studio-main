kind = "web"
previewPath = "/"
title = "CreativeStudio - Media Platform"
version = "1.0.0"
id = "artifacts/media-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24893

[services.development]
run = "pnpm --filter @workspace/media-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/media-studio", "run", "build" ]
publicDir = "artifacts/media-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24893"
BASE_PATH = "/"
